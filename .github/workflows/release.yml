name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Verify tag matches gem version
        run: ruby -r ./lib/sie_analysis/version -e 'abort "Tag must match gem version" unless ENV.fetch("GITHUB_REF_NAME") == "v#{SieAnalysis::VERSION}"'
      - run: gem build sie-analysis.gemspec
      - name: Authenticate with RubyGems
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // shortcut: exchange directly until the RubyGems action supports owner.
            const jwt = await core.getIDToken('rubygems.org');
            const response = await fetch('https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ jwt, owner: 63173 })
            });
            if (!response.ok) throw new Error(`RubyGems OIDC exchange failed: HTTP ${response.status}`);
            const { rubygems_api_key: key } = await response.json();
            if (typeof key !== 'string' || !key) throw new Error('RubyGems returned no API key');
            core.setSecret(key);
            core.exportVariable('GEM_HOST_API_KEY', key);
      - run: gem push sie-analysis-*.gem
